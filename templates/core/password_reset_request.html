{% extends "base_auth.html" %}
{% block title %}Reset Password — SpendWise{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">💰</div>
      SpendWise
    </div>

    <h1 class="auth-title">Forgot your password?</h1>
    <p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>

    <form method="post">
      {% csrf_token %}

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-input" placeholder="you@example.com" required autofocus />
      </div>

      <button type="submit" class="btn btn-primary w-full" style="justify-content:center;">
        Send Reset Link
      </button>
    </form>

    <div class="auth-divider">— or —</div>

    <p style="text-align:center; font-size:0.875rem; color:var(--clr-text-muted);">
      <a href="{% url 'core:login' %}">← Back to Sign In</a>
    </p>
  </div>
</div>
{% endblock %}
